vo=gpu-next
hwdec=vaapi
profile=gpu-hq
fullscreen
input-ipc-server=/tmp/mpvsocket
pause
reset-on-next-file=pause
loop-playlist

# Multi-player synchronization (mpv-sync.lua)
script=/home/tu-studio/.config/mpv/scripts/mpv-sync.lua

# Role: LEADER (controlling all followers)
script-opts=sync-backend=socat,sync-role=leader,sync-target=10.30.70.255:12338,sync-interval=0.5,sync-show_osd=no
