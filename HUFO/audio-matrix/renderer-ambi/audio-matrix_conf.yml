port: 54321
n_input_channels: 32
# osc_position_path: /source/pos/ # expect positions in aed format at position_path/aed or at position_path/azim, position_path/elev, position_path/dist

tracks:
  - name: hoa
    modules:
      - gain:
          factor: 0
          osc_path: /source/send/hoa

      # CURRENTLY DISABLED because not all Ambisonics is routed through audio-matrix
      # as for now, ambisonics filtering/delaying/gainstaging is done in QSC
      # processing fuer die messung
      # - gain:
      #     factor: 1
      #     osc_path: /hoa/gain
      # - filter:
      #     type: HP
      #     freq: 100
      #     osc_path: /hoa/filter
      # - delay:
      #     time: 8 # delay to sync with the sub, 8 ms is a rough guesstimate
      #     osc_path: /hoa/delay

      - hoa_encoder:
          order: 3
          osc_path: /source/pos/aed

  - name: sub
    modules:
      - gain:
          factor: 0
          osc_path: /source/send/subcrossover
      - distance_gain:
          osc_path: /source/pos/dist
      - sum

      # processing durch messung bestimmt
      - gain:
          factor: 0.5
          osc_path: /sub/gain
      - filter:
          type: LP
          freq: 100
          osc_path: /sub/filter
      - delay:
          time: 0
          osc_path: /sub/delay

  - name: lfe
    modules:
      - gain:
          factor: 0
          osc_path: /source/send/lfe
      - sum

      # processing fuer die messung
      - gain:
          factor: 0.35
          osc_path: /lfe/gain
      - filter:
          type: LP
          freq: 100
          osc_path: /lfe/filter
      - delay:
          time: 0
          osc_path: /lfe/delay

