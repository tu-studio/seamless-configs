port: 54321
n_input_channels: 32

tracks:
  - name: wfs
    modules:
      - gain:
          factor: 0
          osc_path: /source/send/wfs

      # processing fuer die messung
      - gain:
          factor: 0.2
          osc_path: /wfs/gain
      - filter:
          type: HP
          freq: 30
          osc_path: /wfs/filter
      - delay:
          time: 0
          osc_path: /wfs/delay

